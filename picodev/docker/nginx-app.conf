# What both servers of the container serve the same way (included last in each):
# security headers, /config.js in every page, static files, the application.
# The public server is nginx.conf; the studio server, when the deployment file
# has [studio], is written by render_config.py.

    # Not on /w/ (map in nginx.conf): an empty value sends no header.
    add_header X-Frame-Options $lab_frame_options always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    sub_filter '<head>' '<head><script src="/config.js"></script>';
    # No request to a third party when a page loads: Velxio's index.html
    # hints at fonts.googleapis.com, github.com and discord.com.
    sub_filter '<link rel="preconnect" href="https://fonts.googleapis.com" />' '';
    sub_filter '<link rel="dns-prefetch" href="https://github.com" />' '';
    sub_filter '<link rel="dns-prefetch" href="https://discord.com" />' '';
    sub_filter_once off;

    location ~* \.(js|css|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    location / {
        try_files $uri $uri/ /index.html;
    }
