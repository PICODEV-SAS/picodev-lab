# nginx inside the container (behind the deployment's TLS proxy).
#
# Nothing deployment-specific is written here. The landing redirect, the
# refused routes, the request size and the rate limits come from the
# deployment file: render_config.py writes the two included files at start
# (the rate-limit zones go to conf.d/00-lab-zones.conf), and the studio
# server when the file has [studio] (conf.d/01-lab-studio.conf).

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    server_tokens off;

    # No access log. nginx writes the client address on every request
    # error, so its error log keeps crit only (the backend logs its own).
    access_log off;
    error_log /var/log/nginx/error.log crit;
    log_not_found off;
    limit_req_log_level warn;

    # The client address comes from the front proxy (Docker network only).
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location = /health {
        proxy_pass http://127.0.0.1:8001/health;
    }

    # Deployment values for the editor, read before the application bundle.
    # Injected by lab-app.conf so that Velxio's index.html stays unpatched.
    location = /config.js {
        add_header Cache-Control "no-cache";
    }
    # client_max_body_size, landing, refused routes, /api/ locations.
    include /etc/nginx/lab/server.inc;

    # Headers, /config.js in the pages, static files, the application.
    include /etc/nginx/lab-app.conf;
}
