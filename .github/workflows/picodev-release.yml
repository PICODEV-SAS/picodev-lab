name: Picodev release

# A version tag publishes a GitHub release with the overlay documentation as a
# PDF. Nothing is built or deployed from here: images and deployments belong to
# the deployment repository.
#
# Only once the repository is public. While it is private the job is skipped:
# a release would be read by nobody, and a GitHub-hosted job on a private
# repository is billed. The tag itself is all the deployment needs. The
# workflow reads the visibility itself, so nothing is to change on opening.
#
# A manual run (Actions > Picodev release > Run workflow, or
# `gh workflow run picodev-release.yml -f tag=vX.Y.Z`) builds the PDF of an
# existing tag and attaches it to that tag's release, creating the release if
# there is none: for a tag whose push did not start the workflow.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, e.g. v0.11.2'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check the tag
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag must be vX.Y.Z, got '$TAG'"; exit 1; }

      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Build the documentation PDF
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD":/documents -w /documents \
            asciidoctor/docker-asciidoctor:1.94 \
            asciidoctor-pdf --failure-level WARN -a revnumber="$TAG" \
            -o "picodev-lab-$TAG.pdf" picodev/README.adoc

      # The release may already exist (made by whoever pushed the tag, or by an
      # earlier run): then only the PDF is attached, replacing an older one.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes ||
            gh release view "$TAG" >/dev/null
          gh release upload "$TAG" --clobber "picodev-lab-$TAG.pdf"
